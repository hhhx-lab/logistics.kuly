# 本地开发依赖服务：PostgreSQL 16、Redis、MinIO。
# 仅供本机开发与联调使用，凭证是本地固定值，不可用于任何对外部署。
# 用法：docker compose up -d
# 目录名含非 ASCII 字符，Compose 无法自动推断项目名，这里显式声明。
name: logistics-agent

services:
  postgres:
    image: postgres:16-alpine
    container_name: logistics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics_dev_only
      # 中文文件名与地名检索需要，排序规则与迁移里的索引口径保持一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: logistics-redis
    restart: unless-stopped
    # 队列投递与通知用，不作为业务真值，因此不开持久化
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 兼容对象存储。原计划用 MinIO，但其镜像现已要求登录才能拉取，
  # 改用 LocalStack 的 S3：签名直传、Range 读、对象版本与生命周期都支持，
  # boto3 调用方式与真实 S3/MinIO 一致，将来换回只需改 .env 的端点。
  localstack:
    image: localstack/localstack:4
    container_name: logistics-s3
    restart: unless-stopped
    environment:
      SERVICES: s3
      # 与 .env 里的 S3_ACCESS_KEY / S3_SECRET_KEY 对应，仅本地开发使用
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
    ports:
      # 4566 是浏览器直传要访问的地址，须与 .env 的 S3_PUBLIC_ENDPOINT 一致
      - "4566:4566"
    volumes:
      - s3-data:/var/lib/localstack
      - ./scripts/s3-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls >/dev/null 2>&1 || exit 1"]
      interval: 6s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  s3-data:

server {
    listen 80;
    listen [::]:80;
    server_name logistics.kuly.com.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/logistics-agent/acme;
        default_type text/plain;
    }
    location / { return 301 https://logistics.kuly.com.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name logistics.kuly.com.cn;
    ssl_certificate /etc/letsencrypt/live/logistics.kuly.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistics.kuly.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    root /opt/logistics-agent/app/src/frontend/dist;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "private, no-store" always;
    }
    # 浏览器仅经限桶、限方法的签名 PUT 上传，GET/HEAD 仍由 API 鉴权读取。
    location ^~ /logistics-documents/ {
        limit_except PUT { deny all; }
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        access_log off;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}

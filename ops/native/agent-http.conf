# DNS 生效后用于 ACME 证书验证；申请 TLS 前不公开登录或业务 API。
server {
    listen 80;
    listen [::]:80;
    server_name logistics.kuly.com.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/logistics-agent/acme;
        default_type text/plain;
    }
    location / {
        return 503;
    }
}

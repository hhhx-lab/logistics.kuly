[project]
name = "logistics-document-agent-backend"
version = "0.1.0"
description = "物流单证智能体后端"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "sqlalchemy[asyncio]>=2,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.14,<2",
  "celery>=5.4,<6",
  "redis>=5,<7",
  "httpx>=0.27,<1",
  "cryptography>=46,<51",
  # 认证：方案 3.2 要求 Argon2id 口令哈希
  "argon2-cffi>=23.1,<26",
  # 对象存储：签名直传与鉴权 Range 代理
  "boto3>=1.35,<2",
  # 解析：原生 PDF 取文字与表格、页渲染、DOCX 受控解包
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<5",
  "python-docx>=1.1,<2",
  # 导出：目标语言 DOCX 模板与 Case 报告 PDF
  "reportlab>=4.2,<5",
]
# 文件类型校验直接比对魔数字节，不引入依赖系统 libmagic 的包，
# 首版只接受 PDF／JPEG／PNG／DOCX 四种格式，白名单判定比通用探测更可控。

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "anyio>=4.6,<5",
  # ASGITransport 不触发 lifespan，测试需要手动驱动它
  "asgi-lifespan>=2.1,<3",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

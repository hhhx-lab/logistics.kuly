# 项目统一 Prompt 发布清单（Agent 方案第 6 节）。
#
# 发布纪律：
# - 已发布的 templates/<key>/<version>.md 不得原位改字。哪怕只改一个标点，也要新增版本文件、
#   在这里追加一条 [[prompt]] 并切换 [defaults]；旧版本保留供活动回合/Run使用。
# - sha256 是模板文件原始字节的摘要；与文件不符时该版本不可用，对应能力拒绝接单。
# - status：active 可接单；unverified 已登记但未通过样本验证，禁止接单；
#   retired 不再作默认，但仍供已冻结该版本的 Run 继续使用。
# - 变量 trust 取值（高到低）：system_policy > user_task > verified_fact > user_preference
#   > session_summary > reference_material。message_role=system 的条目只允许 system_policy，
#   用户材料不得拼进 system 段。

format_version = 1

[defaults]
"ui.localize" = 1
"chat.system" = 2
"chat.intent" = 5
"chat.answer" = 7
"chat.session_summary" = 1
"chat.general" = 8
"document.extract" = 2
"document.translate" = 4
"document.vision_region" = 1
"document.semantic_qa" = 5
"document.revise" = 2
"document.issue_assess" = 1

[[prompt]]
key = "chat.system"
version = 1
sha256 = "3be16a2acaca7af598264824cf967a80f5d9a470e53f10c12b42c1d0dc9cb457"
role = "chat"
message_role = "system"
output_schema = "none@1"
allowed_input_trust = ["system_policy"]
max_input_tokens = 3000
max_output_tokens = 0
status = "active"
change_note = "首版：服务范围、信任层级、证据表达、工具限制与正式命令引导。"
variables = [
  { name = "tool_catalog", type = "json", trust = "system_policy" },
]

[[prompt]]
key = "chat.intent"
version = 1
sha256 = "8f28ebbc44c5d06b607487217abd98fe835dd5360f068b2cb2adffff44521612"
role = "chat"
message_role = "user"
output_schema = "IntentCandidate@1"
allowed_input_trust = ["system_policy", "user_task", "verified_fact"]
max_input_tokens = 6000
max_output_tokens = 8000
status = "active"
change_note = "首版：仅含糊意图时调用，输出注册动作候选；缺目标语言置空并追问。"
variables = [
  { name = "action_catalog", type = "json", trust = "system_policy" },
  { name = "authorized_labels", type = "json", trust = "verified_fact" },
  { name = "question", type = "text", trust = "user_task" },
]

[[prompt]]
key = "chat.answer"
version = 1
sha256 = "c65d390c6e0ca8985be1013e4970631948feed40e628b21a558721ece31ad42f"

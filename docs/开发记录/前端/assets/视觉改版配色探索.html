<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>单证智能体配色探索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 布局：顶部色卡总览 → 每套配色一块完整产品截面；样例用各自的固定配色，外层页面跟随系统明暗 */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --fg: #15191e; --fg-2: #56606b; --fg-3: #858d97; --line: #e2e5e9; --accent: #1f5f99;
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f1215; --surface: #171b20; --fg: #e8ebee; --fg-2: #a3acb6; --fg-3: #6f7882; --line: #2a3038; --accent: #86b7e6; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0f1215; --surface: #171b20; --fg: #e8ebee; --fg-2: #a3acb6; --fg-3: #6f7882; --line: #2a3038; --accent: #86b7e6; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.65; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; letter-spacing: -0.01em; }
.mono { font-family: var(--mono); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 48px 80px; display: flex; flex-direction: column; gap: 56px; }

.intro { display: flex; flex-direction: column; gap: 14px; max-width: 68ch; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--fg-3); }
h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.2; font-weight: 600; }
.lead { color: var(--fg-2); }

/* 色卡总览 */
.deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.swatch-card { display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); color: inherit; text-decoration: none; transition: transform 160ms, border-color 160ms; }
.swatch-card:hover { transform: translateY(-2px); border-color: var(--fg-3); }
.strip { display: grid; grid-template-columns: 1.4fr 1fr 1fr .6fr; height: 72px; }
.strip i { display: block; }
.swatch-card .txt { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 2px; }
.swatch-card b { font-size: 15px; font-weight: 600; }
.swatch-card b span { font-family: var(--mono); font-weight: 500; color: var(--fg-3); margin-right: 6px; font-size: 13px; }
.swatch-card small { font-size: 13px; color: var(--fg-2); }
@media (prefers-reduced-motion: reduce) { .swatch-card { transition: none; } .swatch-card:hover { transform: none; } }

.pal { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 24px; }
.pal-head { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.no { font-family: var(--mono); font-size: 13px; font-weight: 500; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--fg); color: var(--bg); flex-shrink: 0; }
.pal-title { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pal-title h2 { font-size: 22px; font-weight: 600; line-height: 1.3; }
.pal-title p { color: var(--fg-2); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; height: 26px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg-2); background: var(--surface); white-space: nowrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-2); padding: 4px 10px 4px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.chip i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(127,127,127,.25); }
.chip .mono { color: var(--fg); }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.notes p { font-size: 14px; color: var(--fg-2); }
.notes b { color: var(--fg); font-weight: 600; margin-right: 6px; }

.choose { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
.choose h2 { font-size: 20px; font-weight: 600; }
.choose p { color: var(--fg-2); font-size: 14px; }

/* ───── 产品样例 ───── */
.mock-wrap { container-type: inline-size; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.mock {
  display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 480px;
  background: var(--s-page-bg, var(--s-page)); color: var(--s-ink);
  font-family: var(--sans); font-size: 13px; line-height: 1.5;
}
.mock .i { flex-shrink: 0; }
.mock .duo { fill: currentColor; fill-opacity: var(--s-duo, .12); }
.m-nav { background: var(--s-nav); border-right: 1px solid var(--s-nav-line); display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; color: var(--s-nav-ink); min-width: 0; -webkit-backdrop-filter: var(--s-blur, none); backdrop-filter: var(--s-blur, none); }
.m-brand { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 4px; margin-bottom: 10px; }
.m-logo { width: 30px; height: 30px; border-radius: var(--s-logo-r, 8px); background: var(--s-logo-bg); color: var(--s-logo-ink); display: grid; place-items: center; box-shadow: var(--s-logo-shadow, none); flex-shrink: 0; }
.m-name { flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; color: var(--s-nav-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-collapse { color: var(--s-nav-icon); display: grid; place-items: center; width: 26px; height: 26px; }
.m-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; border-radius: var(--s-r-ctl); color: var(--s-nav-ink); transition: background-color 150ms, color 150ms; }
.m-item:hover { background: var(--s-nav-hover); color: var(--s-nav-strong); }
.m-item .m-ico { width: 20px; height: 20px; display: grid; place-items: center; color: var(--s-nav-icon); flex-shrink: 0; transition: color 150ms; }
.m-item:hover .m-ico { color: var(--s-nav-strong); }
.m-item.on { background: var(--s-active-bg); color: var(--s-active-ink); box-shadow: var(--s-active-shadow, none); font-weight: 500; }
.m-item.on .m-ico { color: var(--s-active-icon); }
.m-item .l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-foot { margin-top: auto; border-top: 1px solid var(--s-nav-line-in, var(--s-nav-line)); padding: 10px 6px 0; display: flex; align-items: center; gap: 10px; }
.m-avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--s-avatar-bg); color: var(--s-avatar-ink); font-size: 12px; font-weight: 500; flex-shrink: 0; }
.m-foot .l { font-size: 12.5px; color: var(--s-nav-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.m-main { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.m-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.m-head h3 { font-size: 18px; font-weight: 600; line-height: 1.3; color: var(--s-ink); }
.m-head p { font-size: 12px; color: var(--s-ink3); margin-top: 2px; }
.m-actions { display: flex; gap: 8px; }
.m-btn { height: 32px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--s-r-ctl); font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
.m-btn.sec { background: var(--s-card); border-color: var(--s-line); color: var(--s-ink); box-shadow: var(--s-btn-shadow, none); }
.m-btn.sec .i { color: var(--s-ink2); }
.m-btn.pri { background: var(--s-pri-bg); color: var(--s-pri-ink); box-shadow: var(--s-pri-shadow, none); }

.m-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.m-kpi { background: var(--s-card); border: 1px solid var(--s-line); border-radius: var(--s-r-card); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; box-shadow: var(--s-card-shadow, none); -webkit-backdrop-filter: var(--s-blur, none); backdrop-filter: var(--s-blur, none); }
.m-kpi span { font-size: 12px; color: var(--s-ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-kpi b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--s-ink); line-height: 1.25; }
.m-kpi b small { font-size: 12px; font-weight: 400; color: var(--s-ink3); margin-left: 2px; }
.m-kpi.hl { background: var(--s-hl-bg, var(--s-card)); border-color: var(--s-hl-line, var(--s-line)); }
.m-kpi.hl span { color: var(--s-hl-sub, var(--s-ink3)); }
.m-kpi.hl b { color: var(--s-hl-ink, var(--s-ink)); }
.m-bar { height: 4px; border-radius: 4px; background: var(--s-bar-track, var(--s-line-soft)); margin-top: 6px; overflow: hidden; }
.m-bar i { display: block; height: 100%; width: 62%; border-radius: inherit; background: var(--s-bar, var(--s-pri-bg)); }

.m-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.m-search { flex: 1 1 200px; min-width: 0; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--s-line); border-radius: var(--s-r-ctl); background: var(--s-card); color: var(--s-ink3); }
.m-search span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-filters { display: flex; gap: 6px; flex-wrap: wrap; }

.st { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: var(--s-r-chip); font-size: 12px; white-space: nowrap;
  background: color-mix(in srgb, var(--c) var(--st-mix, 10%), var(--s-chip-base, var(--s-card)));
  border: 1px solid color-mix(in srgb, var(--c) var(--st-line-mix, 0%), transparent);
  color: var(--c); }
.st b { font-weight: 500; font-variant-numeric: tabular-nums; }
.st-risk { --c: var(--s-risk); } .st-warn { --c: var(--s-warn); } .st-ok { --c: var(--s-ok); } .st-hist { --c: var(--s-hist); }

.m-list { background: var(--s-card); border: 1px solid var(--s-line); border-radius: var(--s-r-card); box-shadow: var(--s-card-shadow, none); overflow: hidden; -webkit-backdrop-filter: var(--s-blur, none); backdrop-filter: var(--s-blur, none); }
.m-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--s-line-soft); transition: background-color 150ms; }
.m-row:first-child { border-top: 0; }
.m-row:hover { background: var(--s-row-hover); }
.m-row.sel { background: var(--s-sel); }
.m-file { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--s-r-ctl); background: var(--s-file-bg); color: var(--s-file-ink); border: 1px solid var(--s-file-line, transparent); }
.typed .m-file { background: color-mix(in srgb, var(--ft) 12%, var(--s-chip-base, var(--s-card))); color: var(--ft); border-color: transparent; }
.typed .m-file.pdf { --ft: var(--s-risk); } .typed .m-file.word { --ft: var(--s-pri-bg); } .typed .m-file.image { --ft: var(--s-ok); }
.m-row-main { min-width: 0; }
.m-row-main b, .m-row-main span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-row-main b { font-weight: 500; color: var(--s-ink); font-family: var(--mono); font-size: 12.5px; letter-spacing: -0.01em; }
.m-row-main span { font-size: 12px; color: var(--s-ink3); }
.m-route { font-family: var(--mono); font-size: 12px; color: var(--s-ink2); white-space: nowrap; }
.m-more { color: var(--s-ink3); display: grid; place-items: center; width: 26px; height: 26px; }

.m-composer { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 7px 7px 7px 12px; border: 1px solid var(--s-line); border-radius: var(--s-r-composer); background: var(--s-card); box-shadow: var(--s-composer-shadow, none); color: var(--s-ink3); -webkit-backdrop-filter: var(--s-blur, none); backdrop-filter: var(--s-blur, none); }
.m-composer .hint { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-send { width: 30px; height: 30px; border-radius: var(--s-r-send); display: grid; place-items: center; background: var(--s-send-bg, var(--s-pri-bg)); color: var(--s-send-ink, var(--s-pri-ink)); flex-shrink: 0; }

@container (max-width: 700px) {
  .mock { grid-template-columns: 60px minmax(0, 1fr); }
  .m-name, .m-collapse, .m-item .l, .m-foot .l { display: none; }
  .m-brand, .m-item, .m-foot { justify-content: center; padding-inline: 0; }
  .m-route { display: none; }
  .m-row { grid-template-columns: auto minmax(0, 1fr) auto auto; }
}
@container (max-width: 470px) {
  .m-main { padding: 16px 14px; }
  .m-actions .sec, .m-more { display: none; }
  .m-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .m-kpis .m-kpi:last-child { display: none; }
  .m-row { grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; padding-inline: 12px; }
}
@media (prefers-reduced-motion: reduce) { .m-item, .m-row, .m-item .m-ico { transition: none; } }

/* 共用默认值 */
.mock { --s-r-ctl: 8px; --s-r-card: 12px; --s-r-chip: 6px; --s-r-composer: 14px; --s-r-send: 8px; }

/* 1 集装箱橙 */
.p1 {
  --s-page: #f2f3f5; --s-nav: #ffffff; --s-nav-line: #e4e6ea; --s-card: #fff;
  --s-ink: #111418; --s-ink2: #4d5560; --s-ink3: #8a919b; --s-line: #e4e6ea; --s-line-soft: #eff1f3;
  --s-nav-ink: #4d5560; --s-nav-strong: #111418; --s-nav-icon: #8a919b; --s-nav-hover: #f2f3f5;
  --s-active-bg: #fff1ea; --s-active-ink: #111418; --s-active-icon: #ff5a1f;
  --s-logo-bg: #ff5a1f; --s-logo-ink: #fff; --s-avatar-bg: #111418; --s-avatar-ink: #fff;
  --s-pri-bg: #ff5a1f; --s-pri-ink: #fff; --s-pri-shadow: 0 1px 2px rgba(255,90,31,.35), inset 0 1px 0 rgba(255,255,255,.18);
  --s-hl-bg: #111418; --s-hl-line: #111418; --s-hl-ink: #fff; --s-hl-sub: #9aa1ab; --s-bar: #ff5a1f; --s-bar-track: #2a2f36;
  --s-card-shadow: 0 1px 2px rgba(17,20,24,.04); --s-row-hover: #fafafb; --s-sel: #fff6f1;
  --s-risk: #d92d20; --s-warn: #a15c07; --s-ok: #067647; --s-hist: #475467;
  --s-file-bg: #f2f3f5; --s-file-ink: #4d5560;
}
/* 2 账簿绿金 */
.p2 {
  --s-page: #f4f5f2; --s-nav: #0f2a22; --s-nav-line: #0f2a22; --s-nav-line-in: rgba(255,255,255,.08); --s-card: #fff;
  --s-ink: #13201b; --s-ink2: #4a5a53; --s-ink3: #85928c; --s-line: #e3e7e3; --s-line-soft: #eef1ee;
  --s-nav-ink: #a7bfb5; --s-nav-strong: #f3efe2; --s-nav-icon: #7f9a8f; --s-nav-hover: rgba(255,255,255,.05);
  --s-active-bg: rgba(212,175,95,.14); --s-active-ink: #f3e6c4; --s-active-icon: #d4af5f;
  --s-logo-bg: linear-gradient(160deg, #e6c983, #b88a3b); --s-logo-ink: #0f2a22; --s-logo-shadow: inset 0 1px 0 rgba(255,255,255,.35);
  --s-avatar-bg: #1d3d33; --s-avatar-ink: #f3e6c4;
  --s-pri-bg: #0f2a22; --s-pri-ink: #f3e6c4; --s-send-bg: #0f2a22; --s-send-ink: #d4af5f;
  --s-hl-bg: #0f2a22; --s-hl-line: #0f2a22; --s-hl-ink: #f3e6c4; --s-hl-sub: #8fb0a3; --s-bar: #d4af5f; --s-bar-track: #24453a;
  --s-card-shadow: 0 1px 2px rgba(19,32,27,.04); --s-row-hover: #fafbf9; --s-sel: #f8f4e8;
  --s-risk: #b42318; --s-warn: #a15c07; --s-ok: #2e7d4f; --s-hist: #5b6670;
  --s-file-bg: #f3efe2; --s-file-ink: #8a6a2a;
}
/* 3 信号旗 */
.p3 {
  --s-page: #f3f5f8; --s-nav: #0b1b33; --s-nav-line: #0b1b33; --s-nav-line-in: rgba(255,255,255,.08); --s-card: #fff;
  --s-ink: #0b1b33; --s-ink2: #45556c; --s-ink3: #8391a5; --s-line: #e1e6ee; --s-line-soft: #edf1f6;
  --s-nav-ink: #9fb0c8; --s-nav-strong: #fff; --s-nav-icon: #6f83a0; --s-nav-hover: rgba(255,255,255,.06);
  --s-active-bg: #ffc53d; --s-active-ink: #0b1b33; --s-active-icon: #0b1b33;
  --s-logo-bg: #ffc53d; --s-logo-ink: #0b1b33; --s-avatar-bg: #1b2d4a; --s-avatar-ink: #fff;
  --s-pri-bg: #0b1b33; --s-pri-ink: #fff; --s-send-bg: #ffc53d; --s-send-ink: #0b1b33;
  --s-hl-bg: #ffc53d; --s-hl-line: #ffc53d; --s-hl-ink: #0b1b33; --s-hl-sub: #6b5414; --s-bar: #0b1b33; --s-bar-track: rgba(11,27,51,.15);
  --s-card-shadow: 0 1px 2px rgba(11,27,51,.05); --s-row-hover: #f8fafc; --s-sel: #fffaeb;
  --s-risk: #d92d20; --s-warn: #b54708; --s-ok: #027a48; --s-hist: #4b5a73;
  --s-file-bg: #eef2f8; --s-file-ink: #0b1b33;
}
/* 4 朱印 */
.p4 {
  --s-page: #ffffff; --s-nav: #ffffff; --s-nav-line: #ebebeb; --s-card: #fff;
  --s-ink: #111111; --s-ink2: #555555; --s-ink3: #8f8f8f; --s-line: #e6e6e6; --s-line-soft: #f1f1f1;
  --s-nav-ink: #555; --s-nav-strong: #111; --s-nav-icon: #9a9a9a; --s-nav-hover: #f5f5f5;
  --s-active-bg: #f3f3f3; --s-active-ink: #111; --s-active-icon: #c8302a;
  --s-logo-bg: #c8302a; --s-logo-ink: #fff; --s-logo-r: 4px; --s-logo-shadow: inset 0 0 0 2px rgba(255,255,255,.85), inset 0 0 0 3px #c8302a;
  --s-avatar-bg: #111; --s-avatar-ink: #fff;
  --s-pri-bg: #111111; --s-pri-ink: #fff; --s-send-bg: #c8302a;
  --s-hl-bg: #fff; --s-hl-line: #c8302a; --s-hl-ink: #c8302a; --s-hl-sub: #8f8f8f; --s-bar: #c8302a;
  --s-r-ctl: 6px; --s-r-card: 8px; --s-r-chip: 4px; --s-r-composer: 8px; --s-r-send: 6px;
  --s-row-hover: #fafafa; --s-sel: #fdf4f3; --st-mix: 0%; --st-line-mix: 40%;
  --s-risk: #b42318; --s-warn: #a15c07; --s-ok: #15803d; --s-hist: #525252;
  --s-file-bg: #fff; --s-file-ink: #555; --s-file-line: #e6e6e6;
}
/* 5 冰川玻璃 */
.p5 {
  --s-page: #eef3f8;
  --s-page-bg: radial-gradient(70% 60% at 0% 0%, #d6e9ff 0%, rgba(214,233,255,0) 70%), radial-gradient(60% 55% at 100% 100%, #dcf5ec 0%, rgba(220,245,236,0) 70%), radial-gradient(40% 40% at 85% 10%, #ece6ff 0%, rgba(236,230,255,0) 70%), #eef3f8;
  --s-nav: rgba(255,255,255,.5); --s-nav-line: rgba(255,255,255,.8); --s-nav-line-in: rgba(13,27,42,.06); --s-card: rgba(255,255,255,.7); --s-chip-base: #fff;
  --s-blur: blur(18px) saturate(1.4);

      <div class="m-composer">${ic("clip", 16)}<span class="hint">问智能体：EGLV142400387 的提单和发票收货人为什么不一致？</span><span class="m-send">${ic("send", 16)}</span></div>
    </div>
  </div></div>`;
}

document.getElementById("deck").innerHTML = PALETTES.map((p, i) => `
  <a class="swatch-card" href="#${p.id}">
    <span class="strip">${p.strip.map(c => `<i style="background:${c}"></i>`).join("")}</span>
    <span class="txt"><b><span>${i + 1}</span>${p.name}</b><small>${p.tags.join(" · ")}</small></span>
  </a>`).join("");

document.getElementById("pals").innerHTML = PALETTES.map((p, i) => `
  <section class="pal" id="${p.id}">
    <div class="pal-head">
      <span class="no">${i + 1}</span>
      <div class="pal-title"><h2>${p.name}</h2><p>${p.mood}</p></div>
      <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
    </div>
    ${mock(p)}
    <div class="chips">${p.colors.map(([n, c]) => `<span class="chip"><i style="background:${c}"></i>${n} <span class="mono">${c}</span></span>`).join("")}</div>
    <div class="notes"><p><b>亮点</b>${p.good}</p><p><b>注意</b>${p.care}</p></div>
  </section>`).join("");
</script>
